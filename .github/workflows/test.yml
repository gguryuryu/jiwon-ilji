# 올릴 때마다 윈도우·맥·리눅스에서 자동 테스트를 돌린다(친구 컴퓨터가 윈도우라 윈도우도 꼭 확인).
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # 친구 컴퓨터(윈도우)에서 쓰는 바로가기와 실행기를 실제 윈도우에서 확인한다.
      - name: 윈도우 바로가기 · 실행기 · 창 닫으면 꺼지기
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JIWON_TEST: '1'
          PORT: '4190'
        run: |
          # 사용자 폴더 이름이 한글이어도 되도록, 한글 폴더에 복사해서 바로가기를 만들고 그 바로가기를 그대로 실행해 본다.
          $korean = Join-Path $env:RUNNER_TEMP '한글 폴더\지원일지'
          New-Item -ItemType Directory -Force -Path $korean | Out-Null
          Copy-Item -Recurse -Force -Path * -Destination $korean
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $korean 'assets\make-shortcut.ps1')
          if ($LASTEXITCODE -ne 0) { throw '바로가기를 만들지 못했습니다' }
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            $link = Join-Path $folder '지원일지.lnk'
            if (-not (Test-Path -LiteralPath $link)) { throw "바로가기가 없습니다: $link" }
          }
          # 바로가기 안에 저장된 전용 창 경로를 유니코드로 읽어, 한글 경로가 그대로인지 확인한다.
          $bytes = [IO.File]::ReadAllBytes((Join-Path ([Environment]::GetFolderPath('Desktop')) '지원일지.lnk'))
          $text = [Text.Encoding]::Unicode.GetString($bytes) + [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1)
          $exe = Join-Path $korean 'windows\app\jiwon-ilji.exe'
          if (-not $text.Contains($exe)) { throw "바로가기 안의 경로가 깨졌습니다(기대: $exe)" }
          Write-Host "바로가기 경로 확인: $exe"
          # 예전 바로가기가 쓰던 실행기(Edge 앱 창)도 계속 동작하는지 확인한다.
          $vbs = Join-Path $korean 'assets\launch-windows.vbs'
          cscript //nologo $vbs
          if ($LASTEXITCODE -ne 0) { throw '실행기가 서버를 켜지 못했습니다' }
          $page = Invoke-WebRequest http://127.0.0.1:4190/js/main.js -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw '화면 파일을 받지 못했습니다' }
          $headers = @{ 'X-Jiwon-Ilji' = '1' }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4190/api/ping -Headers $headers -ContentType 'application/json' -Body '{"id":"ci"}' | Out-Null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4190/api/bye -Headers $headers -ContentType 'application/json' -Body '{"id":"ci"}' | Out-Null
          Start-Sleep -Seconds 10
          $stillUp = $true
          try { Invoke-WebRequest http://127.0.0.1:4190/api/data -UseBasicParsing -TimeoutSec 3 | Out-Null } catch { $stillUp = $false }
          if ($stillUp) { throw '앱 창을 닫았는데 서버가 꺼지지 않았습니다' }
          Write-Host '창을 닫자 서버가 꺼졌습니다'
      # 저장소에 든 윈도우 전용 창(windows/app)을 한글 폴더에서 실제로 띄워 보고, 닫으면 서버도 꺼지는지 확인한다.
      - name: 윈도우 전용 창 실행 확인
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PORT: '4193'
          JIWON_BYE_MS: '500'
        run: |
          $korean = Join-Path $env:RUNNER_TEMP '한글 폴더\지원일지'
          $env:JOB_TRACKER_DATA_PATH = Join-Path $env:RUNNER_TEMP 'window-data\job-search.json'
          $result = Join-Path $env:RUNNER_TEMP 'window-smoke.json'
          $app = Start-Process -FilePath (Join-Path $korean 'windows\app\jiwon-ilji.exe') -ArgumentList "--smoke=$result" -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw '창이 2분 안에 끝나지 않았습니다' }
          if (-not (Test-Path $result)) { throw "결과 파일이 없습니다(종료 코드 $($app.ExitCode))" }
          $text = Get-Content -Raw -Encoding UTF8 $result
          Write-Host $text
          $smoke = $text | ConvertFrom-Json
          if (-not $smoke.ok -or $smoke.nav -lt 5) { throw "앱 화면이 뜨지 않았습니다: $text" }
          Start-Sleep -Seconds 3
          $stillUp = $true
          try { Invoke-WebRequest http://127.0.0.1:4193/api/data -UseBasicParsing -TimeoutSec 3 | Out-Null } catch { $stillUp = $false }
          if ($stillUp) { throw '창을 닫았는데 서버가 꺼지지 않았습니다' }
          Write-Host '전용 창이 떴고, 닫자 서버도 꺼졌습니다'
      # 맥 네이티브 앱: 소스가 컴파일되는지, 저장소에 든 앱이 다른 맥에서도 서버를 켜고 끄는지 확인한다.
      - name: 맥 앱 컴파일 · 실행 확인
        if: runner.os == 'macOS'
        env:
          JIWON_TEST: '1'
          PORT: '4191'
        run: |
          swiftc -O -swift-version 5 -o "$RUNNER_TEMP/jiwon-ilji" mac/main.swift -framework AppKit -framework WebKit
          lipo -archs 지원일지.app/Contents/MacOS/jiwon-ilji | grep -q x86_64
          lipo -archs 지원일지.app/Contents/MacOS/jiwon-ilji | grep -q arm64
          codesign --verify --deep 지원일지.app
          ./지원일지.app/Contents/MacOS/jiwon-ilji
