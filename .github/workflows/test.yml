# 올릴 때마다 윈도우·맥·리눅스에서 자동 테스트를 돌린다(친구 컴퓨터가 윈도우라 윈도우도 꼭 확인).
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # 친구 컴퓨터(윈도우)에서 쓰는 바로가기와 실행기를 실제 윈도우에서 확인한다.
      - name: 윈도우 바로가기 · 실행기 · 창 닫으면 꺼지기
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JIWON_TEST: '1'
          PORT: '4190'
        run: |
          # 사용자 폴더 이름이 한글이어도 되도록, 한글 폴더에 복사해서 바로가기를 만들고 그 바로가기를 그대로 실행해 본다.
          $korean = Join-Path $env:RUNNER_TEMP '한글 폴더\지원일지'
          New-Item -ItemType Directory -Force -Path $korean | Out-Null
          Copy-Item -Recurse -Force -Path * -Destination $korean
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $korean 'assets\make-shortcut.ps1')
          if ($LASTEXITCODE -ne 0) { throw '바로가기를 만들지 못했습니다' }
          $shortcut = $null
          foreach ($folder in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {
            $link = Join-Path $folder '지원일지.lnk'
            if (-not (Test-Path -LiteralPath $link)) { throw "바로가기가 없습니다: $link" }
            $shortcut = (New-Object -ComObject Shell.Application).NameSpace($folder).ParseName('지원일지.lnk').GetLink
            Write-Host "$link -> $($shortcut.Path) $($shortcut.Arguments) [$($shortcut.WorkingDirectory)]"
          }
          $vbs = $shortcut.Arguments.Trim('"')
          if (-not (Test-Path -LiteralPath $vbs)) { throw "바로가기가 가리키는 실행기가 없습니다(한글 경로가 깨졌을 수 있음): $vbs" }
          cscript //nologo $vbs
          if ($LASTEXITCODE -ne 0) { throw '실행기가 서버를 켜지 못했습니다' }
          $page = Invoke-WebRequest http://127.0.0.1:4190/js/main.js -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw '화면 파일을 받지 못했습니다' }
          $headers = @{ 'X-Jiwon-Ilji' = '1' }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4190/api/ping -Headers $headers -ContentType 'application/json' -Body '{"id":"ci"}' | Out-Null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4190/api/bye -Headers $headers -ContentType 'application/json' -Body '{"id":"ci"}' | Out-Null
          Start-Sleep -Seconds 10
          $stillUp = $true
          try { Invoke-WebRequest http://127.0.0.1:4190/api/data -UseBasicParsing -TimeoutSec 3 | Out-Null } catch { $stillUp = $false }
          if ($stillUp) { throw '앱 창을 닫았는데 서버가 꺼지지 않았습니다' }
          Write-Host '창을 닫자 서버가 꺼졌습니다'
