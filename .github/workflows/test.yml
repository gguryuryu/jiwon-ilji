# 올릴 때마다 윈도우·맥·리눅스에서 자동 테스트를 돌린다(친구 컴퓨터가 윈도우라 윈도우도 꼭 확인).
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
